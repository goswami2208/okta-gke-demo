server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER}
          audiences: ${OKTA_AUDIENCE:api://default}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: items
              uri: ${ITEMS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/items/**
              filters:
                - StripPrefix=1          # /api/items/** -> /items/**; Authorization header is forwarded as-is

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
