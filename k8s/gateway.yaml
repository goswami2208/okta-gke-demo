apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: REGION-docker.pkg.dev/PROJECT_ID/demo/gateway:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: OKTA_ISSUER
              valueFrom: { configMapKeyRef: { name: app-config, key: OKTA_ISSUER } }
            - name: OKTA_AUDIENCE
              valueFrom: { configMapKeyRef: { name: app-config, key: OKTA_AUDIENCE } }
            - name: CORS_ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: app-config, key: CORS_ALLOWED_ORIGINS } }
            - name: ITEMS_SERVICE_URL
              value: http://items-service.demo.svc.cluster.local:8080
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "gateway-backendconfig"}'
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gateway-backendconfig
  namespace: demo
spec:
  healthCheck:
    type: HTTP
    requestPath: /actuator/health/readiness
    port: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: api-cert
  namespace: demo
spec:
  domains:
    - api.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: demo
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: api-ip
    networking.gke.io/managed-certificates: api-cert
    kubernetes.io/ingress.allow-http: "false"
spec:
  defaultBackend:
    service:
      name: gateway
      port: { number: 80 }
