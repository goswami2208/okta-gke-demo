apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  OKTA_ISSUER: https://YOUR_ORG.okta.com/oauth2/default
  OKTA_AUDIENCE: api://default
  CORS_ALLOWED_ORIGINS: https://app.example.com
# DB2 credentials are NOT stored in git. Create the secret with:
#   kubectl -n demo create secret generic db2-credentials \
#     --from-literal=url='jdbc:db2://DB2_HOST:50000/DEMODB' \
#     --from-literal=username=... --from-literal=password=...
