apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-service
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: items-service }
  template:
    metadata:
      labels: { app: items-service }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: items-service
          image: REGION-docker.pkg.dev/PROJECT_ID/demo/items-service:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: OKTA_ISSUER
              valueFrom: { configMapKeyRef: { name: app-config, key: OKTA_ISSUER } }
            - name: OKTA_AUDIENCE
              valueFrom: { configMapKeyRef: { name: app-config, key: OKTA_AUDIENCE } }
            - name: DB2_URL
              valueFrom: { secretKeyRef: { name: db2-credentials, key: url } }
            - name: DB2_USER
              valueFrom: { secretKeyRef: { name: db2-credentials, key: username } }
            - name: DB2_PASSWORD
              valueFrom: { secretKeyRef: { name: db2-credentials, key: password } }
          resources:             # requests are mandatory: the HPA computes CPU % against them
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: items-service
  namespace: demo
spec:
  selector: { app: items-service }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: items-service
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: items-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
